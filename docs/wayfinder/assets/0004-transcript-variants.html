<!doctype html>
<!--
  PROTOTYPE — throwaway. 回答 wayfinder ticket「Transcript 信息结构」：
  气泡、工具调用、思考、fileChange 四类内容的展示形态与层次。
  三个结构不同的变体，?variant=A|B|C 切换，底部浮动条 + ←/→ 键。
  嵌在仿 app 外壳（sidebar + chat header）里评估，非真空。
-->
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — Transcript 信息结构</title>
<style>
  :root {
    color-scheme: light dark;
    --canvas: light-dark(#f4f5f7, #17181b);
    --sidebar: light-dark(#eceef1, #1d1e22);
    --raised: light-dark(#ffffff, #232428);
    --hover: light-dark(#e6e8ec, #26272b);
    --border: light-dark(#dcdee3, #2c2d32);
    --border-strong: light-dark(#c6c8ce, #3a3b40);
    --t1: light-dark(#1a1b1e, #f2f3f5);
    --t2: light-dark(#3c3d40, #c8c9cd);
    --t3: light-dark(#6b6c70, #9a9b9f);
    --t4: light-dark(#9a9b9f, #6b6c70);
    --accent: light-dark(#247896, #6fc7e8);
    --green: light-dark(#2f7d4f, #7fd6a2);
    --red: light-dark(#b3453f, #e2938d);
    --amber: light-dark(#8a6116, #d9b26a);
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font: 14px/1.6 -apple-system, "PingFang SC", "SF Pro Text", system-ui, sans-serif;
    background: var(--canvas); color: var(--t1);
    display: flex; overflow: hidden;
  }
  code, pre { font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }

  /* ---------- fake app shell ---------- */
  .shell-sidebar {
    width: 232px; flex: none; background: var(--sidebar);
    border-right: 1px solid var(--border); padding: 46px 8px 8px;
  }
  .shell-sidebar .row {
    padding: 8px 10px; border-radius: 7px; color: var(--t3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px;
  }
  .shell-sidebar .row.active { background: var(--hover); color: var(--t1); }
  .shell-sidebar .row small { display: block; color: var(--t4); font-size: 11px; }
  .shell-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .shell-header {
    height: 52px; flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 16px; border-bottom: 1px solid var(--border);
  }
  .shell-header .title { font-weight: 600; }
  .shell-header .badge {
    font-size: 11px; color: var(--t3); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 9px;
  }
  .shell-header .spacer { flex: 1; }
  .shell-header .ctl { color: var(--t3); font-size: 12px; }
  .shell-composer {
    margin: 10px 16px 14px; padding: 0 2px; flex: none;
    color: var(--t4); font-size: 13.5px;
  }
  .shell-composer .input-area { padding: 2px 6px 10px; }
  .composer-bar { display: flex; align-items: center; gap: 10px; }
  .model-pop { position: relative; flex: 1; min-width: 0; }
  .composer-bar .pill {
    width: 100%; border: none; border-radius: 999px; padding: 10px 16px;
    background: light-dark(#ececec, #2a2a2a); color: var(--t1);
    font-size: 13.5px; font-weight: 500; cursor: pointer; list-style: none;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .composer-bar .pill::-webkit-details-marker { display: none; }
  .composer-bar .pill:hover { background: light-dark(#e2e2e2, #333); }
  .composer-bar .pill .chev { color: var(--t3); display: inline-flex; }
  .composer-bar .mic { color: var(--t2); display: grid; place-items: center; flex: none; }
  .composer-bar .send {
    width: 32px; height: 32px; border-radius: 50%; background: #111; flex: none;
    color: #fff; display: grid; place-items: center;
  }
  .pop-panel {
    position: absolute; bottom: calc(100% + 10px); left: 0; width: min(430px, 100%);
    z-index: 50; background: light-dark(#ffffff, #1f1f1f);
    border-radius: 16px; padding: 14px 18px 18px;
    box-shadow: 0 16px 44px rgb(0 0 0 / .16), 0 0 0 .5px rgb(0 0 0 / .05);
  }
  .pop-panel .adv {
    display: flex; align-items: center; justify-content: space-between;
    color: var(--t2); font-size: 14.5px; margin: 2px 2px 14px; cursor: pointer;
  }
  .pop-panel .adv .l { display: inline-flex; align-items: center; gap: 7px; }
  .pop-panel .adv .chev { color: var(--t3); display: inline-flex; }
  .pop-panel .adv .zap { color: var(--t1); display: inline-flex; }
  .step-slider { position: relative; height: 34px; }
  .step-slider .track {
    position: absolute; inset: 3px 0; border-radius: 999px;
    background: light-dark(#e4e4e4, #333);
  }
  .step-slider .fill {
    position: absolute; top: 3px; bottom: 3px; left: 0; width: 72.5%;
    border-radius: 999px; background: #3f8cff;
  }
  .step-slider .dot {
    position: absolute; top: 50%; width: 5px; height: 5px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: light-dark(rgb(0 0 0 / .22), rgb(255 255 255 / .28));
  }
  .step-slider .dot.on { background: rgb(255 255 255 / .55); }
  .step-slider .thumb {
    position: absolute; top: 50%; left: 72.5%; width: 30px; height: 30px;
    border-radius: 50%; background: #fff; transform: translate(-50%, -50%);
    box-shadow: 0 1px 7px rgb(0 0 0 / .35);
  }
  /* changed-files card (ref: t3code) */
  .cf-card {
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--raised); margin: 10px 0 2px;
  }
  .cf-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px 8px;
  }
  .cf-title { font-size: 11px; letter-spacing: .07em; color: var(--t3); }
  .cf-title .adds, .cf-row .adds { color: #2f9e63; }
  .cf-title .dels, .cf-row .dels { color: #d64545; }
  .cf-actions button {
    font-size: 12px; border: 1px solid var(--border); background: var(--canvas);
    border-radius: 8px; padding: 3px 10px; color: var(--t1); margin-left: 6px; cursor: pointer;
  }
  .cf-actions button:hover { background: var(--hover); }
  .cf-row {
    display: flex; align-items: center; gap: 8px; padding: 4px 14px;
    font-size: 12.5px; color: var(--t2);
  }
  .cf-row.folder { color: var(--t3); }
  .cf-row .path { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .cf-row:last-child { padding-bottom: 10px; }
  .turn-footer { color: var(--t4); font-size: 11.5px; margin: 6px 2px 16px; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; }

  .proto-banner {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 60;
    background: #111; color: #ffd75e; font-size: 11px; letter-spacing: .06em;
    padding: 3px 12px; border-radius: 999px; opacity: .9;
  }

  /* ---------- floating switcher ---------- */
  .switcher {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 70;
    display: flex; align-items: center; gap: 2px;
    background: #101114; color: #f2f3f5; border-radius: 999px;
    padding: 4px 6px; box-shadow: 0 6px 24px rgb(0 0 0 / .35);
    font-size: 12px; user-select: none;
  }
  .switcher button {
    background: transparent; border: 0; color: inherit; cursor: pointer;
    width: 26px; height: 26px; border-radius: 999px; font-size: 14px;
  }
  .switcher button:hover { background: #2a2b30; }
  .switcher .label { padding: 0 10px; white-space: nowrap; }
  .switcher .label b { color: #ffd75e; }

  /* ==================================================
     Variant A — 气泡增强（现状演进）
     ================================================== */
  .va { max-width: 860px; margin: 0 auto; padding: 20px 24px 70px; display: flex; flex-direction: column; gap: 14px; }
  .va .msg { display: flex; gap: 10px; }
  .va .msg .avatar {
    width: 26px; height: 26px; flex: none; border-radius: 7px;
    display: grid; place-items: center; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); background: var(--raised); color: var(--t2);
  }
  .va .msg.user .avatar { background: var(--hover); }
  .va .bubble {
    background: var(--raised); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; max-width: 720px; color: var(--t1);
  }
  .va .msg.user .bubble { background: var(--hover); }
  .va .card {
    margin-left: 36px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--raised); overflow: hidden;
  }
  .va .card summary {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    padding: 7px 12px; color: var(--t2); font-size: 13px; list-style: none;
  }
  .va .card summary::-webkit-details-marker { display: none; }
  .va .card summary:hover { background: var(--hover); }
  .va .card .status { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex: none; }
  .va .card.thinking .status { background: var(--amber); }
  .va .card .name { font-weight: 500; }
  .va .card .dim { color: var(--t4); font-size: 12px; }
  .va .card pre { padding: 10px 12px; border-top: 1px solid var(--border); color: var(--t2); overflow-x: auto; }
  .va .filechange summary .adds { color: var(--green); }
  .va .filechange summary .dels { color: var(--red); }

  /* ==================================================
     Variant B — 时间线密集
     ================================================== */
  .vb { max-width: 920px; margin: 0 auto; padding: 18px 24px 70px; }
  .vb .event { position: relative; padding: 0 0 4px 30px; }
  .vb .event::before {
    content: ""; position: absolute; left: 10px; top: 22px; bottom: -2px;
    width: 1px; background: var(--border);
  }
  .vb .event:last-child::before { display: none; }
  .vb .dot {
    position: absolute; left: 3px; top: 4px; width: 15px; height: 15px;
    border-radius: 50%; border: 1px solid var(--border-strong);
    background: var(--raised); display: grid; place-items: center;
    font-size: 9px; color: var(--t3);
  }
  .vb .head {
    display: flex; align-items: baseline; gap: 8px; padding: 2px 0;
    color: var(--t3); font-size: 12px;
  }
  .vb .head .who { font-weight: 600; color: var(--t2); }
  .vb .head .time { color: var(--t4); }
  .vb .body { padding: 2px 0 10px; color: var(--t1); }
  .vb .body.collapsed { display: none; }
  .vb .inline-toggle {
    background: none; border: 0; padding: 0; cursor: pointer;
    color: var(--accent); font-size: 12px;
  }
  .vb .toolrow, .vb .thinkrow {
    display: flex; align-items: center; gap: 7px; padding: 3px 0;
    color: var(--t3); font-size: 12.5px;
  }
  .vb .toolrow .ok { color: var(--green); }
  .vb .thinkrow .tk { color: var(--amber); }
  .vb pre {
    margin-top: 4px; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; background: var(--raised); color: var(--t2); overflow-x: auto;
  }
  .vb .fc { color: var(--t2); font-size: 12.5px; }
  .vb .fc .adds { color: var(--green); } .vb .fc .dels { color: var(--red); }

  /* ==================================================
     Variant C — 文档 + 过程边栏
     ================================================== */
  .vc-wrap { display: flex; height: 100%; }
  .vc { flex: 1; min-width: 0; max-width: 760px; margin: 0 auto; padding: 26px 32px 70px; }
  .vc .q {
    color: var(--t3); font-size: 13px; border-left: 2px solid var(--border-strong);
    padding-left: 10px; margin: 18px 0 10px;
  }
  .vc .q:first-child { margin-top: 0; }
  .vc .doc p { margin: 0 0 12px; color: var(--t1); font-size: 14.5px; line-height: 1.75; }
  .vc .doc p strong { color: var(--t1); }
  .vc .changes {
    margin: 4px 0 18px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--raised); padding: 8px 12px; font-size: 12.5px; color: var(--t2);
  }
  .vc .changes .h { font-weight: 600; color: var(--t2); margin-bottom: 4px; }
  .vc .changes .adds { color: var(--green); } .vc .changes .dels { color: var(--red); }
  .vc-rail {
    width: 52px; flex: none; border-left: 1px solid var(--border);
    padding: 18px 0 70px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .vc-rail .chip {
    position: relative; width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--raised); color: var(--t3);
    display: grid; place-items: center; font-size: 11px; cursor: pointer;
  }
  .vc-rail .chip:hover { background: var(--hover); color: var(--t1); }
  .vc-rail .chip .pop {
    display: none; position: absolute; right: 42px; top: -6px; width: 300px;
    background: var(--raised); border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; color: var(--t2); text-align: left;
    box-shadow: 0 8px 24px rgb(0 0 0 / .18); z-index: 40; white-space: normal;
  }
  .vc-rail .chip:hover .pop { display: block; }
  .vc-rail .chip .pop b { color: var(--t1); display: block; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="proto-banner">PROTOTYPE — throwaway · ticket「Transcript 信息结构」</div>

<aside class="shell-sidebar">
  <div class="row active">修复侧边栏按钮换行<small>Pi · Pi</small></div>
  <div class="row">【需求】暑期包框<small>Codex · Codex CLI</small></div>
  <div class="row">综合交通白泽监控日报<small>Codex · Codex CLI</small></div>
  <div class="row">cmdk 是什么<small>Pi · Pi</small></div>
</aside>

<div class="shell-main">
  <header class="shell-header">
    <span class="title">修复侧边栏按钮换行</span>
    <span class="badge">Pi</span>
    <span class="spacer"></span>
    <span class="ctl">任务检查器</span>
  </header>

  <div class="scroll" id="scroll"></div>

  <div class="shell-composer">
    <div class="input-area">让 EV 处理一件事…</div>
    <div class="composer-bar">
      <details class="model-pop" open>
        <summary class="pill">Qwen3.8 Max · 高
          <span class="chev"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
        </summary>
        <div class="pop-panel">
          <div class="adv">
            <span class="l">高级 <span class="chev"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span></span>
            <span class="zap"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg></span>
          </div>
          <div class="step-slider" role="slider" aria-label="强度" aria-valuemin="1" aria-valuemax="5" aria-valuenow="4" aria-valuetext="高，第 4 项，共 5 项">
            <span class="track"></span><span class="fill"></span>
            <span class="dot on" style="left:5%"></span>
            <span class="dot on" style="left:27.5%"></span>
            <span class="dot on" style="left:50%"></span>
            <span class="dot on" style="left:72.5%"></span>
            <span class="dot" style="left:95%"></span>
            <span class="thumb"></span>
          </div>
        </div>
      </details>
      <span class="mic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></span>
      <span class="send"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></span>
    </div>
  </div>
</div>

<div class="switcher">
  <button id="prev" aria-label="上一个变体">‹</button>
  <span class="label" id="label"></span>
  <button id="next" aria-label="下一个变体">›</button>
</div>

<script>
const VARIANTS = [
  ['A', '气泡增强（现状演进）'],
  ['B', '时间线密集'],
  ['C', '文档 + 过程边栏'],
];

const data = {
  user1: '帮我修一下侧边栏「新任务」按钮换行的问题',
  thinking1: '侧边栏 new-task-row 里塞了主按钮、RuntimePicker、目录按钮三个控件；240px 宽下主按钮被挤到换行。先看 CSS 再决定是收敛控件还是改布局……',
  steps: [
    ['✓', 'bash', 'bun run --cwd apps/desktop typecheck · 通过 · 1.2s'],
    ['✓', 'read', 'src/renderer/src/components/Sidebar.tsx · 203 行'],
    ['✓', 'edit', 'src/renderer/src/styles/index.css · +14 −3'],
  ],
  answer1: '已修复。原因是 RuntimePicker 与主按钮同行竞争宽度：给 .new-task-button 加了 white-space: nowrap，并把 Runtime 选择移到按钮下方独立一行。顺带确认了 Sidebar 结构：header 只保留 Agent 选择，创建区为「新任务 + 目录图标」，下方是 Pi / Codex 分段。typecheck 与 26 个测试全部通过。',
  files: [
    ['src/renderer/src/styles/index.css', 14, 3],
    ['src/renderer/src/components/Sidebar.tsx', 6, 2],
  ],
  footer: '13:04 · 26s',
};

function cfCard() {
  const adds = data.files.reduce((n, f) => n + f[1], 0);
  const dels = data.files.reduce((n, f) => n + f[2], 0);
  const rows = data.files.map(f =>
    `<div class="cf-row file"><span class="path">${f[0].replace('src/renderer/src/', '')}</span><span class="adds">+${f[1]}</span><span class="dels">−${f[2]}</span></div>`).join('');
  return `<div class="cf-card">
    <div class="cf-head">
      <span class="cf-title">CHANGED FILES (${data.files.length}) · <span class="adds">+${adds}</span> / <span class="dels">−${dels}</span></span>
      <span class="cf-actions"><button>Collapse all</button><button>View diff</button></span>
    </div>
    <div class="cf-row folder">▾ src/renderer/src</div>
    ${rows}
  </div>
  <div class="turn-footer">${data.footer}</div>`;
}

function va() {
  return `<div class="va">
    <div class="msg user"><div class="avatar">你</div><div class="bubble">${data.user1}</div></div>
    <details class="card thinking"><summary><span class="status"></span><span class="name">思考过程</span><span class="dim">3 秒</span></summary><pre>${data.thinking1}</pre></details>
    <details class="card"><summary><span class="status"></span><span class="name">过程</span><span class="dim">3 步 · bash · read · edit</span></summary><pre>${data.steps.map(s => `${s[0]} ${s[1]}  ${s[2]}`).join('\n')}</pre></details>
    <div class="msg"><div class="avatar">A</div><div class="bubble">${data.answer1}</div></div>
    ${cfCard()}
  </div>`;
}

function vb() {
  return `<div class="vb">
    <div class="event"><div class="dot">你</div>
      <div class="head"><span class="who">你</span><span class="time">13:02</span></div>
      <div class="body">${data.user1}</div></div>
    <div class="event"><div class="dot">思</div>
      <div class="head"><span class="who">思考</span><span class="time">13:02</span>
        <button class="inline-toggle" data-t="b1">展开</button></div>
      <div class="body collapsed" id="b1">${data.thinking1}</div></div>
    <div class="event"><div class="dot">▸</div>
      <div class="head"><span class="who">过程</span><span class="time">3 步</span>
        <button class="inline-toggle" data-t="b2">展开</button></div>
      <div class="body collapsed" id="b2">${data.steps.map(s => `${s[0]} ${s[1]} · ${s[2]}`).join('<br>')}</div></div>
    <div class="event"><div class="dot">A</div>
      <div class="head"><span class="who">Assistant</span><span class="time">13:04</span></div>
      <div class="body">${data.answer1}</div>
      ${cfCard()}</div>
  </div>`;
}

function vc() {
  return `<div class="vc-wrap">
    <div class="scroll" style="flex:1">
      <div class="vc">
        <div class="q">${data.user1}</div>
        <div class="doc"><p>${data.answer1}</p></div>
        ${cfCard()}
      </div>
    </div>
    <div class="vc-rail">
      <div class="chip">思<span class="pop"><b>思考过程 · 3s</b>${data.thinking1}</span></div>
      <div class="chip">▸<span class="pop"><b>bash · 通过</b>$ bun run --cwd apps/desktop typecheck</span></div>
      <div class="chip">▸<span class="pop"><b>read · 203 行</b>Sidebar.tsx</span></div>
      <div class="chip">✎<span class="pop"><b>edit</b>styles/index.css<br>+14 −3</span></div>
    </div>
  </div>`;
}

const RENDER = { A: va, B: vb, C: vc };
let index = 0;

function current() {
  const param = new URLSearchParams(location.search).get('variant');
  const found = VARIANTS.findIndex(v => v[0] === param);
  return found >= 0 ? found : 0;
}

function render() {
  index = current();
  const [key, name] = VARIANTS[index];
  document.getElementById('scroll').innerHTML = RENDER[key]();
  document.getElementById('label').innerHTML = `<b>${key}</b> — ${name}`;
  document.querySelectorAll('.inline-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.t);
      const hidden = target.classList.toggle('collapsed');
      btn.textContent = hidden ? '展开' : '收起';
    });
  });
}

function go(delta) {
  const next = (index + delta + VARIANTS.length) % VARIANTS.length;
  history.replaceState(null, '', `?variant=${VARIANTS[next][0]}`);
  render();
}

document.getElementById('prev').addEventListener('click', () => go(-1));
document.getElementById('next').addEventListener('click', () => go(1));
document.addEventListener('keydown', e => {
  if (/^(input|textarea)$/i.test(document.activeElement?.tagName ?? '')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});

render();
</script>
</body>
</html>
