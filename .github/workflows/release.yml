name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate tag and workspace versions
        run: pnpm run release:check --tag="${GITHUB_REF_NAME}"
      - name: Verify workspaces
        run: pnpm run verify
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Build desktop distributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run dist
      - name: Package browser extensions
        run: |
          pnpm run package:extension
          pnpm run package:extension:firefox
      - name: Package standalone CLI
        run: pnpm run package:cli
      - name: Generate checksums
        run: pnpm run release:checksums
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/**/*.dmg
            apps/desktop/release/**/*.zip
            apps/desktop/release/**/latest-mac.yml
            apps/desktop/release/SHA256SUMS.txt
            apps/browser-extension/.output/*-chrome.zip
            apps/browser-extension/.output/*-firefox.zip
            apps/browser-extension/.output/*-sources.zip
            apps/cli/dist/ev-darwin-*
            apps/cli/dist/sogud-ev-*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
