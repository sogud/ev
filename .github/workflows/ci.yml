name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run lint
      - run: pnpm run quality
      - run: pnpm run package:cli
      - uses: actions/upload-artifact@v4
        with:
          name: ev-builds
          path: |
            apps/desktop/dist-electron/
            apps/browser-extension/.output/chrome-mv3/
            apps/cli/dist/ev-darwin-*
            apps/cli/dist/sogud-ev-*.tgz
          retention-days: 7
