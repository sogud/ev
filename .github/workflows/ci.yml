name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run lint
      - run: bun run quality
      - run: bun run package:cli
      - uses: actions/upload-artifact@v4
        with:
          name: ev-builds
          path: |
            apps/desktop/dist-electron/
            apps/browser-extension/.output/chrome-mv3/
            apps/cli/dist/ev-darwin-*
            apps/cli/dist/sogud-ev-*.tgz
          retention-days: 7
